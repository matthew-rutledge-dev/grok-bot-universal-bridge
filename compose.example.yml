# Example only. Copy to the deployment host as compose.yml and adjust paths.
# Runs side by side with any existing bridge on its own loopback port.
# After editing .env: docker compose up -d --force-recreate
# In scripts use `docker compose run -T` / `exec -T`: without -T the container reads
# stdin and eats the rest of a piped script.
services:
  universal-bridge:
    build: .
    image: grok-bot-universal-bridge:local
    restart: unless-stopped
    # Host-only files live OUTSIDE the repo dir (a sibling <repo>-host/ dir), so they are
    # never in the build context or touched by git pull. Override with BRIDGE_HOST_DIR.
    env_file: ${BRIDGE_HOST_DIR:-../grok-bot-universal-bridge-host}/.env   # mode 600, never in git
    # In config/bridge.json inside the container: "bind": "0.0.0.0", "allowNonLoopbackBind": true.
    # The host side stays loopback via the ports line below.
    ports:
      - "127.0.0.1:18090:18090"        # loopback only; the tunnel routes /discord/*, /grokbuild/* here
    volumes:
      - ${BRIDGE_HOST_DIR:-../grok-bot-universal-bridge-host}/config:/app/config:ro   # host-only bridge.json + adapter configs
      - ${BRIDGE_HOST_DIR:-../grok-bot-universal-bridge-host}/registry.json:/run/bridge/registry.json:ro
      - bridge-data:/app/data          # hold file, request records, audit.jsonl
      # Backup uploads (POST /backup/upload, off until BRIDGE_BACKUP_UPLOAD_KEY is set).
      # The host dir must be writable by the container's `bridge` user.
      - /mnt/grokbot_backup:/backup:rw
volumes:
  bridge-data:
