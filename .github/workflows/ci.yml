name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: config check against the shipped examples
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path');const c=JSON.parse(fs.readFileSync('config/bridge.example.json','utf8'));c.registryPath='config/registry.example.json';for(const n of ['discord','grokbuild','tesla']){c.adapters[n].configPath='adapters/'+n+'/config.example.json';c.adapters[n].enabled=true;}fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'bridge.json'),JSON.stringify(c));"
          BRIDGE_CONFIG="$RUNNER_TEMP/bridge.json" node dist/src/main.js --check
      - run: npm run leak-check
